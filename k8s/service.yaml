apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: portfolio-production
  labels:
    app.kubernetes.io/name: portfolio
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30082
      protocol: tcp
