global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. VPS System Metrics (CPU, RAM, Disk, Network)
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # 3. Docker Container Metrics (portfolio, jenkins, sonarqube, portainer)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
